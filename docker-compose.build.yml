# Build this checkout without replacing the published GHCR tag.
# docker compose -f docker-compose.yml -f docker-compose.build.yml up --build -d
services:
  koreograf:
    image: koreograf:local
    pull_policy: build
    build:
      context: .
      # Stamp this checkout when the caller knows its commit.
      args:
        GIT_SHA: ${KOREOGRAF_GIT_SHA:-}
        BUILT_AT: ${KOREOGRAF_BUILT_AT:-}
