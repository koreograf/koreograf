services:
  koreograf:
    # Published image. A local build uses docker-compose.build.yml and the tag koreograf:local.
    image: ghcr.io/koreograf/koreograf:0.1.0-alpha.5 # x-release-please-version
    pull_policy: missing
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KOREOGRAF_BIND: 0.0.0.0:8080
      KOREOGRAF_DATA: /var/lib/koreograf
      KOREOGRAF_WEB: /opt/koreograf/web
      KOREOGRAF_EXAMPLES: /opt/koreograf/examples
      KOREOGRAF_ADMIN_USER: ${KOREOGRAF_ADMIN_USER:-admin}
      KOREOGRAF_ADMIN_PASSWORD: ${KOREOGRAF_ADMIN_PASSWORD:-}
      KOREOGRAF_RUNNER: ${KOREOGRAF_RUNNER:-auto}
      # admins oder all. Vorgabe admins. all nur im vertrauten Netz.
      KOREOGRAF_LOCAL_RUNNER_FOR: ${KOREOGRAF_LOCAL_RUNNER_FOR:-admins}
      KOREOGRAF_JOB_TIMEOUT_SECS: ${KOREOGRAF_JOB_TIMEOUT_SECS:-1800}
      KOREOGRAF_JOB_OUTPUT_LINES: ${KOREOGRAF_JOB_OUTPUT_LINES:-8000}
      KOREOGRAF_SECRET_KEY: ${KOREOGRAF_SECRET_KEY:-}
      # Logformat und Datenbank-URL gelten beim Prozessstart und kommen aus .env.
      KOREOGRAF_LOG_FORMAT: ${KOREOGRAF_LOG_FORMAT:-}
      KOREOGRAF_HSTS: ${KOREOGRAF_HSTS:-false}
      # true, false oder auto. auto setzt Secure nur hinter einem vertrauten Proxy.
      KOREOGRAF_COOKIE_SECURE: ${KOREOGRAF_COOKIE_SECURE:-auto}
      KOREOGRAF_TRUSTED_PROXY: ${KOREOGRAF_TRUSTED_PROXY:-false}
      KOREOGRAF_DATABASE_URL: ${KOREOGRAF_DATABASE_URL:-}
      # Directory, proxy, runner, time limit, and output line limit apply until the first save
      # under Settings. After that, the database replaces these variables.
      # Ein Proxy-Name wird nur gesetzt, wenn .env oder die Shell ihn setzen.
      # Eine leere Zeichenkette würde den großgeschriebenen Proxy für git abschalten.
      HTTP_PROXY:
      HTTPS_PROXY:
      NO_PROXY:
      http_proxy:
      https_proxy:
      no_proxy:
      KOREOGRAF_LDAP_URL: ${KOREOGRAF_LDAP_URL:-}
      KOREOGRAF_LDAP_MODE: ${KOREOGRAF_LDAP_MODE:-ldap}
      KOREOGRAF_LDAP_BIND_DN: ${KOREOGRAF_LDAP_BIND_DN:-}
      KOREOGRAF_LDAP_BIND_PASSWORD: ${KOREOGRAF_LDAP_BIND_PASSWORD:-}
      KOREOGRAF_LDAP_USER_BASE: ${KOREOGRAF_LDAP_USER_BASE:-}
      KOREOGRAF_LDAP_USER_FILTER: ${KOREOGRAF_LDAP_USER_FILTER:-}
      KOREOGRAF_LDAP_USERNAME_ATTR: ${KOREOGRAF_LDAP_USERNAME_ATTR:-}
      KOREOGRAF_LDAP_GROUP_ATTR: ${KOREOGRAF_LDAP_GROUP_ATTR:-}
      KOREOGRAF_LDAP_GROUP_BASE: ${KOREOGRAF_LDAP_GROUP_BASE:-}
      KOREOGRAF_LDAP_STARTTLS: ${KOREOGRAF_LDAP_STARTTLS:-}
      KOREOGRAF_LDAP_TLS_INSECURE: ${KOREOGRAF_LDAP_TLS_INSECURE:-}
      KOREOGRAF_LDAP_CA_FILE: ${KOREOGRAF_LDAP_CA_FILE:-}
    volumes:
      - koreograf-data:/var/lib/koreograf
      # Execution Environments brauchen den Docker-Socket.
      # Der Socket ist gleichwertig mit root auf dem Host.
      # - /var/run/docker.sock:/var/run/docker.sock

volumes:
  koreograf-data:
