[package]
name = "koreograf"
version = "0.1.0-alpha.11"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Prototype for team-scoped automation with a dependency cache and workflows"
publish = false

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.23"
chrono = "0.4"
chrono-tz = "0.10"
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
ldap3 = { version = "0.12.0", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
nix = { version = "0.31", default-features = false, features = ["signal", "user", "fs", "process"] }
pbkdf2 = "0.13"
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.9.0", features = ["transport-io", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shlex = "2"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["aws-lc-rs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false }
deadpool-postgres = "0.14.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
await_holding_lock = "deny"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
