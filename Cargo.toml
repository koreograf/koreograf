[package]
name = "koreograf"
version = "0.1.0-alpha.5"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Prototype for team-scoped automation with a dependency cache and workflows"
publish = false

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.23"
chrono = "0.4"
chrono-tz = "0.10"
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
ldap3 = { version = "0.12.0", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
nix = { version = "0.31", default-features = false, features = ["signal"] }
pbkdf2 = "0.13"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
