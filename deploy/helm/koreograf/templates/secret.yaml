apiVersion: v1
kind: Secret
metadata:
  name: {{ include "koreograf.fullname" . }}
  labels:
    {{- include "koreograf.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.admin.password | quote }}
  secret-key: {{ .Values.secretKey | quote }}
  ldap-bind-password: {{ .Values.ldap.bindPassword | quote }}
