{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "koreograf.fullname" . }}
  labels:
    {{- include "koreograf.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecretKeys.adminPassword | quote }}: {{ .Values.admin.password | quote }}
  {{ .Values.existingSecretKeys.secretKey | quote }}: {{ .Values.secretKey | quote }}
  {{ .Values.existingSecretKeys.ldapBindPassword | quote }}: {{ .Values.ldap.bindPassword | quote }}
{{- end }}
