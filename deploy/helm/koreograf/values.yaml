# Ein Replica. SQLite hat einen Schreiber; ein zweites Pod überschreibt die Datei.
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/koreograf/koreograf
  tag: "0.1.0-alpha.12" # x-release-please-version
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

admin:
  user: admin
  # Leer: der erste Start schreibt das Passwort nach initial-admin-password im Volume.
  password: ""

# 64 Hex-Zeichen. Leer: der Pod erzeugt data/secret.key im Volume.
# Ein ungültiger, nicht leerer Wert beendet den Start, auch wenn data/secret.key existiert.
secretKey: ""

# Bearer-Token fuer GET /metrics. Leer: der Endpunkt bleibt offen.
# Der Wert liegt im Chart-Secret unter existingSecretKeys.metricsToken.
metrics:
  token: ""

# true nur hinter HTTPS. Auf plain HTTP bleibt Strict-Transport-Security aus.
hsts: false

# Name eines bestehenden Secrets. Leer: das Chart legt das Secret an.
# existingSecretKeys sind die Schlüsselnamen in diesem Secret.
existingSecret: ""
existingSecretKeys:
  adminPassword: admin-password
  secretKey: secret-key
  ldapBindPassword: ldap-bind-password
  metricsToken: metrics-token

# Leer: non-root (uid 10001), ausser runner.dockerSocket.enabled ist true.
# Ein gesetztes Objekt ersetzt die Vorgabe komplett, inklusive
# readOnlyRootFilesystem, seccompProfile und dem /tmp-emptyDir.
# fsGroup 10001 setzt der Volume-Treiber. Ohne fsGroup bleiben alte Dateien root.
podSecurityContext: {}
securityContext: {}

runner:
  # auto, docker oder local. Das Abbild hat keinen local-Modus.
  mode: auto
  # admins oder all. Vorgabe admins: nur Administratoren starten einen lokalen Job.
  # all ist für ein vertrautes Netz, in dem Webhooks lokal laufen sollen.
  localJobs: admins
  dockerSocket:
    enabled: false
    hostPath: /var/run/docker.sock
    # GID des Sockets auf dem Host: stat -c '%g' /var/run/docker.sock
    group: 999

ldap:
  url: ""
  mode: ldap
  bindDn: ""
  bindPassword: ""
  userBase: ""
  userFilter: ""
  usernameAttr: ""
  groupAttr: memberOf
  groupBase: ""
  starttls: false
  tlsInsecure: false

# Firmen-CAs als read-only Verzeichnis mit *.pem und *.crt einbinden.
# LDAP, NetBox und git vertrauen ihnen zusätzlich zu den öffentlichen CAs.
caDirectory:
  enabled: false
  hostPath: /etc/koreograf/ca

ingress:
  enabled: false
  className: ""
  host: koreograf.example.com
  path: /
  tls: false

# Leer folgt ingress.tls: true wird "true", sonst "auto".
# Sonst true, false oder auto. auto setzt Secure nur mit trustedProxy.
cookieSecure: ""
# true liest X-Forwarded-Proto für das Session-Cookie. Nur hinter einem Proxy.
trustedProxy: false

# Oeffentliche Origin(s) fuer Browser-Schreibzugriffe hinter einem Proxy,
# zum Beispiel https://koreograf.example.com. Leer nutzt den Request-Host.
publicUrl: ""

persistence:
  size: 2Gi
  storageClass: ""

resources: {}
