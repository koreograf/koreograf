# Ein Replica. SQLite hat einen Schreiber; ein zweites Pod überschreibt die Datei.
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/koreograf/koreograf
  tag: "0.1.0-alpha.5" # x-release-please-version
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

admin:
  user: admin
  # Leer: der erste Start schreibt das Passwort nach initial-admin-password im Volume.
  password: ""

# 64 Hex-Zeichen. Leer: der Pod erzeugt data/secret.key im Volume.
secretKey: ""

# Name eines bestehenden Secrets. Leer: das Chart legt das Secret an.
# existingSecretKeys sind die Schlüsselnamen in diesem Secret.
existingSecret: ""
existingSecretKeys:
  adminPassword: admin-password
  secretKey: secret-key
  ldapBindPassword: ldap-bind-password

# Leer: non-root (uid 10001), ausser runner.dockerSocket.enabled ist true.
# Ein gesetztes Objekt ersetzt die Vorgabe komplett.
# fsGroup 10001 setzt der Volume-Treiber. Ohne fsGroup bleiben alte Dateien root.
podSecurityContext: {}
securityContext: {}

runner:
  # auto, docker oder local
  mode: auto
  # admins oder all. Vorgabe admins: nur Administratoren starten einen lokalen Job.
  # all ist für ein vertrautes Netz, in dem Webhooks lokal laufen sollen.
  localJobs: admins
  dockerSocket:
    enabled: false
    hostPath: /var/run/docker.sock

ldap:
  url: ""
  mode: ldap
  bindDn: ""
  bindPassword: ""
  userBase: ""
  userFilter: ""
  usernameAttr: ""
  groupAttr: memberOf
  groupBase: ""
  starttls: false
  tlsInsecure: false
  # Absoluter PEM-Pfad im Container. Leer nutzt die System-CAs.
  caFile: ""

ingress:
  enabled: false
  className: ""
  host: koreograf.example.com
  path: /
  tls: false

persistence:
  size: 2Gi
  storageClass: ""

resources: {}
