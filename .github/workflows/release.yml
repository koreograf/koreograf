# Publishes the alpha image. This workflow does not deploy.
# A tag push runs the image job. release-please creates its tag with the
# default GITHUB_TOKEN, and that push does not start a new workflow, so
# release-please.yml calls this file in the same run.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Tag to publish, including the leading v
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          docker build \
            --tag "ghcr.io/koreograf/koreograf:${version}" \
            --tag "ghcr.io/koreograf/koreograf:${RELEASE_TAG}" \
            .
          docker push "ghcr.io/koreograf/koreograf:${version}"
          docker push "ghcr.io/koreograf/koreograf:${RELEASE_TAG}"
