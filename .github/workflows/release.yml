# Publishes the alpha image. This workflow does not deploy.
# A tag push runs the jobs below. release-please creates its tag with the
# default GITHUB_TOKEN, and that push does not start a new workflow, so
# release-please.yml calls this file in the same run.
# The image is published only after the CI workflow succeeds. The signature
# is keyless. Cosign records the workflow that started this run.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Tag to publish, including the leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: tests
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  image:
    name: image (${{ matrix.arch }})
    needs: tests
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Image tags
        id: tags
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record build information
        id: build-info
        run: |
          echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          outputs: type=image,name=ghcr.io/koreograf/koreograf,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            SOURCE=https://github.com/koreograf/koreograf
            GIT_SHA=${{ steps.build-info.outputs.sha }}
            BUILT_AT=${{ steps.build-info.outputs.date }}
          cache-from: type=gha,scope=koreograf-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=koreograf-release-${{ matrix.arch }}
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: image manifest
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      tag: ${{ steps.tags.outputs.tag }}
    steps:
      - name: Image tags
        id: tags
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list
        id: merge
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          cd /tmp/digests
          refs=()
          for digest in *; do
            refs+=("ghcr.io/koreograf/koreograf@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "ghcr.io/koreograf/koreograf:${VERSION}" \
            -t "ghcr.io/koreograf/koreograf:${TAG}" \
            "${refs[@]}"
          digest="$(docker buildx imagetools inspect "ghcr.io/koreograf/koreograf:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes "ghcr.io/koreograf/koreograf@${DIGEST}"

  packages:
    name: packages (${{ matrix.arch }})
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the linker
        run: |
          if [ "${{ matrix.arch }}" = amd64 ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          else
            image="ghcr.io/cross-rs/aarch64-unknown-linux-musl@sha256:183f923c24aaf6220d0107a26a737cdec7c18dcf04c571b2c52fe49ed9f6045e"
            mkdir -p /tmp/koreograf-toolchain
            docker run --rm -v /tmp/koreograf-toolchain:/out --entrypoint sh "$image" -c 'cp -a /x-tools/aarch64-unknown-linux-musl /out/'
            echo "/tmp/koreograf-toolchain/aarch64-unknown-linux-musl/bin" >> "$GITHUB_PATH"
          fi
      - name: Build the binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-unknown-linux-musl-gcc
          AR_aarch64_unknown_linux_musl: aarch64-unknown-linux-musl-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-unknown-linux-musl-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Install nfpm
        env:
          NFPM_VERSION: 2.48.0
          NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          printf '%s  %s\n' "$NFPM_SHA256" /tmp/nfpm.tar.gz | sha256sum -c -
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
      - name: Build the packages
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          VERSION="$version" nfpm package --config packaging/nfpm.yaml --packager deb \
            --target "dist/koreograf_${version}_${PACKAGE_ARCH}.deb"
          VERSION="$version" nfpm package --config packaging/nfpm.yaml --packager rpm \
            --target "dist/koreograf_${version}_${PACKAGE_ARCH}.rpm"
      - name: Upload the packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::no release for $TAG, packages not uploaded"
            exit 0
          fi
          gh release upload "$TAG" dist/*.deb dist/*.rpm --clobber

  notes:
    name: release notes
    needs: image-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add the digest to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image-manifest.outputs.digest }}
          TAG: ${{ needs.image-manifest.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release view "$TAG" --json body -q .body >/tmp/koreograf-release-notes.md
          image="ghcr.io/koreograf/koreograf@${DIGEST}"
          if grep -qF "\`${image}\`" /tmp/koreograf-release-notes.md; then
            exit 0
          fi
          {
            printf '\n\nImage: `%s`\n' "$image"
            printf 'Signed with cosign keyless.\n'
          } >>/tmp/koreograf-release-notes.md
          gh release edit "$TAG" --notes-file /tmp/koreograf-release-notes.md
