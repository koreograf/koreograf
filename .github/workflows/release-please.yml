# Opens the release pull request and, when that pull request merges, tags
# the release. The default GITHUB_TOKEN does not start other workflows, so
# the image job calls release.yml in this same run. A tag pushed by a person
# still starts release.yml on its own. Write permissions sit on the
# release-please job. The image job does not inherit repository secrets.
name: release-please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  notes:
    name: release notes
    needs:
      - release-please
      - image
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add the digest to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release view "$TAG" --json body -q .body >/tmp/koreograf-release-notes.md
          image="ghcr.io/koreograf/koreograf@${DIGEST}"
          if grep -qF "\`${image}\`" /tmp/koreograf-release-notes.md; then
            exit 0
          fi
          {
            printf '\n\nImage: `%s`\n' "$image"
            printf 'Signed with cosign keyless.\n'
          } >>/tmp/koreograf-release-notes.md
          gh release edit "$TAG" --notes-file /tmp/koreograf-release-notes.md
