# Checks the pull request title on its own, so an edited title re-runs this
# check and does not start the rest of CI. Squash merges use that title.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: title
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title length
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          chars=$(printf '%s' "$TITLE" | wc -m)
          if [ "$chars" -gt 72 ]; then
            printf 'Pull request title is %s characters. The limit is 72.\n' "$chars"
            exit 1
          fi
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: "^[a-z](?:.*[^.])?$"
          subjectPatternError: The subject must start with a lowercase letter and must not end with a period.
