---
- name: Reject cleanup names that leave the scratch directory
  ansible.builtin.assert:
    that:
      - item is match("^[A-Za-z0-9._-]+$")
      - item != "."
      - item != ".."
    fail_msg: "incident_report_cleanup_files only accepts plain file names, not {{ item }}."
  loop: "{{ incident_report_cleanup_files }}"
  when: incident_report_action == "cleanup-tmp"
  delegate_to: localhost
  run_once: true

- name: Record the alert on the controller
  ansible.builtin.template:
    src: report.txt.j2
    dest: "{{ incident_report_path }}"
    mode: "{{ __incident_report_file_mode }}"
  delegate_to: localhost
  run_once: true

- name: Remove listed scratch files on the controller
  ansible.builtin.file:
    path: "{{ incident_report_cleanup_dir }}/{{ item }}"
    state: absent
  loop: "{{ incident_report_cleanup_files }}"
  when: incident_report_action == "cleanup-tmp"
  delegate_to: localhost
  run_once: true
